; PlatformIO Project Configuration File for M5Stack StopWatch Dev Kit (ESP32-S3)

[env:m5stack-stopwatch]
board = m5stack-stopwatch
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${env.build_src_filter} +<../boards/m5stack-stopwatch>
build_flags =
	${env.build_flags}
	-Os
	-Iboards/m5stack-stopwatch
	-D CORE_DEBUG_LEVEL=1
	-D DEVICE_NAME='"M5Stack StopWatch"'

	; Using M5GFX driver for circular AMOLED display (466x466)
	-D USE_M5GFX=1
	-D HAS_SCREEN=1
	-D ROUND_SCREEN=1
	-D NO_TOUCH_FOOTER=1
	-D TFT_WIDTH=466
	-D TFT_HEIGHT=466
	-D ROTATION=0

	; Touchscreen support (CST820)
	-D HAS_TOUCH=1

	; Default I2C buses (Internal: SDA=11, SCL=10 / External HY2.0-4P: SDA=48, SCL=47)
	-D GROVE_SDA=48
	-D GROVE_SCL=47
	-D SYS_I2C_SDA=11
	-D SYS_I2C_SCL=10

	; RTC support (RX8130CE)
	-D HAS_RTC=1
	-D RTC_SDA=11
	-D RTC_SCL=10

	; Button configuration
	-D HAS_BTN=1
	-D BTN_ALIAS='"Select"'
	-D BTN_PIN=-1
	-D BTN_ACT=LOW

	; USB HID emulation
	-D USB_as_HID=1

	-D ALLOW_ALL_GPIO_FOR_IR_RF=1
	-D IR_TX_PINS='{{"Grove SDA", GROVE_SDA}, {"Grove SCL", GROVE_SCL}}'
	-D IR_RX_PINS='{{"Grove SCL", GROVE_SCL}, {"Grove SDA", GROVE_SDA}}'
	-D TXLED=GROVE_SDA
	-D LED_ON=HIGH
	-D LED_OFF=LOW

	-D RF_TX_PINS='{{"Grove SDA", GROVE_SDA}, {"Grove SCL", GROVE_SCL}}'
	-D RF_RX_PINS='{{"Grove SCL", GROVE_SCL}, {"Grove SDA", GROVE_SDA}}'

	-D SDCARD_CS=-1
	-D SDCARD_SCK=-1
	-D SDCARD_MISO=-1
	-D SDCARD_MOSI=-1

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified
	m5stack/M5GFX

lib_ignore =
	TFT_eSPI

